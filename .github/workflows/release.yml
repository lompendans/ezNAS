name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            NAME="eznas-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/eznas.exe" .
              (cd dist && zip -q "$NAME.zip" eznas.exe)
              rm dist/eznas.exe
            else
              GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/eznas" .
              tar -C dist -czf "dist/$NAME.tar.gz" eznas
              rm dist/eznas
            fi
          done
          cd dist
          sha256sum eznas-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/eznas-* dist/checksums.txt --title "ezNAS ${GITHUB_REF_NAME}" --generate-notes
